<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AEGIS — Heterogeneous SoC Architecture Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-2:#ffffff;
    --bg-3:#eef2f8;
    --panel:#f7f9fc;
    --line:#dee3ec;
    --line-2:#c0c8d6;
    --text:#1b1d20;
    --text-dim:#555a62;
    --text-mute:#8b8f97;
    --accent:#4A55B8;     /* indigo (primary) */
    --accent-2:#88AED4;   /* sky blue (secondary) */
    --accent-3:#3B47A6;   /* deep indigo for data */
    --accent-4:#6B7DD0;   /* medium indigo for control */
    --danger:#b23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Inter Tight",system-ui,sans-serif;}
  body{min-height:100vh;overflow-x:hidden}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}

  /* layout */
  .app{display:grid;grid-template-rows:auto auto}
  header.bar{
    display:flex;align-items:center;gap:18px;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:#f7f9fc;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand .mark{
    width:22px;height:22px;border-radius:6px;
    background:conic-gradient(from 120deg,#4A55B8,#88AED4,#3B47A6,#6B7DD0,#4A55B8);
    position:relative;
  }
  .brand .mark::after{
    content:"";position:absolute;inset:4px;border-radius:3px;background:var(--bg);
  }
  .brand h1{font-size:15px;letter-spacing:.08em;margin:0;font-weight:600;text-transform:uppercase}
  .brand .sub{font-size:12px;color:var(--text-mute);letter-spacing:.16em;text-transform:uppercase}
  .chip{font-family:"JetBrains Mono",monospace;font-size:11px;padding:3px 8px;border:1px solid var(--line-2);border-radius:4px;color:var(--text-dim)}
  .spacer{flex:1}
  .scenariobar{display:flex;gap:6px}
  .scenariobar button{
    background:transparent;border:1px solid var(--line-2);color:var(--text-dim);
    font-family:inherit;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;
    transition:all .15s ease;letter-spacing:.02em;
  }
  .scenariobar button:hover{color:var(--text);border-color:#444}
  .scenariobar button.active{color:#ffffff;background:var(--accent);border-color:var(--accent);font-weight:600}

  /* main grid */
  .main{display:grid;grid-template-columns:1fr;min-height:0}
  .stage{
    position:relative;background:
      radial-gradient(1200px 600px at 30% -10%,#f5f8fc 0%,transparent 60%),
      var(--bg);
    padding:14px 28px 12px 28px;overflow:auto;
  }
  .sidebar{
    border-left:1px solid var(--line);
    background:var(--panel);
    display:flex;flex-direction:column;min-width:0;
  }

  /* diagram svg container */
  .board{position:relative;max-width:1280px;margin:0 auto}
  .diagram{display:block;width:100%;height:auto}

  /* sidebar tabs */
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{
    flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
    padding:12px 10px;color:var(--text-mute);font-family:inherit;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  }
  .tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
  .tabpane{padding:18px 20px;overflow:auto;flex:1;min-height:0}

  .inspect h3{font-size:13px;margin:0 0 2px 0;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);font-weight:500}
  .inspect h2{font-size:22px;margin:0 0 12px 0;font-weight:600;letter-spacing:-.01em}
  .inspect .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .inspect .row .k{color:var(--text-dim);font-size:12px}
  .inspect .row .v{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text)}
  .inspect .note{margin-top:12px;padding:12px;background:var(--bg-3);border:1px solid var(--line);border-radius:6px;font-size:13px;line-height:1.5;color:var(--text-dim)}
  .inspect .pill{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-mute);margin-left:8px;vertical-align:middle}
  .inspect .pill.live{border-color:var(--accent);color:var(--accent)}

  /* event log */
  .log{font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.55;color:var(--text-dim)}
  .log .line{padding:2px 0;display:flex;gap:10px}
  .log .cyc{color:var(--text-mute);min-width:64px}
  .log .ev{color:var(--text)}
  .log .ev .block{color:var(--accent-3)}
  .log .ev .warn{color:var(--accent-2)}
  .log .ev .ok{color:var(--accent)}
  .log .ev .err{color:var(--danger)}

  /* transport bar — inline above phasebar */
  .transport{
    max-width:1450px;margin:0 auto 8px auto;
    background:var(--bg-2);
    border:1px solid var(--line);border-radius:6px;
    padding:6px 10px;display:flex;align-items:center;gap:12px;
  }
  .transport .btn{
    background:var(--bg-3);border:1px solid var(--line-2);color:var(--text);
    width:26px;height:26px;border-radius:4px;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;padding:0;font-size:12px;
  }
  .transport .btn:hover{border-color:#4a525d}
  .transport .btn.primary{background:var(--accent);color:#ffffff;border-color:var(--accent)}
  .transport .scrub{flex:1;position:relative;height:6px;background:var(--bg-3);border-radius:3px;cursor:pointer}
  .transport .scrub .fill{position:absolute;top:0;left:0;height:100%;background:var(--accent);border-radius:3px;transition:width .08s linear}
  .transport .scrub .markers{position:absolute;top:-3px;left:0;right:0;height:12px}
  .transport .scrub .markers .m{position:absolute;width:2px;height:12px;background:var(--line-2);border-radius:1px}
  .transport .step{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-dim);min-width:100px;text-align:right}
  .transport .speed{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mute)}
  .transport select{background:var(--bg-3);border:1px solid var(--line-2);color:var(--text);border-radius:4px;font-family:inherit;font-size:11px;padding:3px 6px}

  /* phase marker above stage — single-line strip */
  .phasebar{
    max-width:1450px;margin:0 auto 14px auto;
    display:flex;flex-wrap:nowrap;gap:0;border:1px solid var(--line);border-radius:6px;background:var(--bg-2);overflow:hidden;
  }
  .phasebar .p{flex:1 1 0;min-width:0;padding:6px 8px;font-size:10px;letter-spacing:.04em;color:var(--text-mute);border-right:1px solid var(--line);position:relative;line-height:1.25;overflow:hidden}
  .phasebar .p .lbl{display:block;font-weight:500;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-size:11px;margin-top:1px}
  .phasebar .p:last-child{border-right:0}
  .phasebar .p.done{color:var(--text-dim)}
  .phasebar .p.active{color:var(--text);background:linear-gradient(180deg,rgba(74,85,184,.10),transparent)}
  .phasebar .p.active::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
  .phasebar .p .n{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--text-mute);display:block}

  /* verify panel */
  .verify .row2{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:baseline}
  .verify .row2 .l{font-size:13px}
  .verify .row2 .l small{display:block;color:var(--text-mute);font-family:"JetBrains Mono",monospace;font-size:11px;margin-top:2px}
  .verify .badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:4px;font-weight:600}
  .verify .badge.ok{background:rgba(74,85,184,.12);color:var(--accent)}
  .verify .badge.warn{background:rgba(136,174,212,.15);color:var(--accent-2)}
  .verify .badge.info{background:rgba(59,71,166,.12);color:var(--accent-3)}
  .verify h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute);margin:22px 0 6px 0;font-weight:500}
  .verify h4:first-child{margin-top:0}

  /* diagram styling (for JSX components too) */
  .block{cursor:pointer;transition:filter .15s ease}
  .block:hover{filter:brightness(1.15)}
  .block .body{fill:#ffffff;stroke:#c0c8d6;stroke-width:1}
  .block.selected .body{stroke:var(--accent);stroke-width:2}
  .block.active .body{stroke:var(--accent);stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(74,85,184,.35))}
  .block .title{fill:#1b1d20;font-family:"Inter Tight",sans-serif;font-weight:600;font-size:13px;pointer-events:none}
  .block .sub{fill:#6b7079;font-family:"JetBrains Mono",monospace;font-size:10px;pointer-events:none}

  .wire{stroke:#b8c0d0;stroke-width:1.5;fill:none}
  .wire.data{stroke:var(--accent-3)}
  .wire.ctrl{stroke:var(--accent-4)}
  .wire.active{stroke:var(--accent);stroke-width:2.2;filter:drop-shadow(0 0 4px rgba(74,85,184,.35))}

  .wire-label{display:none}
  .wire-label.ctrl{fill:#3B47A6}
  .wire-label.active{fill:#2E3A8C;font-weight:600}

  /* band labels + tensor core inset */
  .band-label{fill:#8d92a3;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.2em;font-weight:600;pointer-events:none}
  .tc-inset .tc-title{fill:#2a2e3c;font-family:"Inter Tight",sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;pointer-events:none}
  .tc-inset .tc-sub{fill:#8d92a3;font-family:"JetBrains Mono",monospace;font-size:10px;pointer-events:none}
  .tc-inset .tc-lbl{fill:#1f2330;font-family:"Inter Tight",sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;pointer-events:none}
  .tc-inset .tc-note{fill:#6b7680;font-family:"JetBrains Mono",monospace;font-size:9.5px;pointer-events:none}
  .tc-inset .tc-cell{fill:#2a2e3c;font-family:"JetBrains Mono",monospace;font-size:9.5px;pointer-events:none}
  .tc-inset .tc-mul{fill:#2E3A8C;font-family:"Inter Tight",sans-serif;font-weight:700;font-size:14px;pointer-events:none}
  .tc-inset .tc-stage{fill:#1f2330;font-family:"Inter Tight",sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;pointer-events:none}
  .tc-inset .tc-stage-sub{fill:#8d92a3;font-family:"JetBrains Mono",monospace;font-size:9px;pointer-events:none}
  .tc-inset .tc-fu{fill:#2E3A8C;font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:600;pointer-events:none}
  .tc-inset .tc-fu-dim{fill:#6b7680;font-weight:400}
  .tc-inset .tc-lane{fill:#4A55B8;font-family:"Inter Tight",sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;pointer-events:none}
  .tc-inset.active .tc-title{fill:var(--accent)}
  .tc-inset.active .tc-cell{fill:#1F2A6E;font-weight:600}
  .tc-inset.active .tc-mul{fill:#1F2A6E}
  .board{max-width:1450px !important}

  /* packet token */
  .token{opacity:0;transition:opacity .25s ease}
  .token.on{opacity:1}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c0c8d6;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* tweaks panel */
  .tweaks{
    position:fixed;right:20px;top:70px;
    background:rgba(255,255,255,.98);backdrop-filter:blur(10px);
    border:1px solid var(--line-2);border-radius:10px;padding:14px 16px;
    box-shadow:0 8px 24px rgba(20,22,26,.08);
    min-width:240px;z-index:60;display:none;
  }
  .tweaks.open{display:block}
  .tweaks h5{margin:0 0 10px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
  .tweaks label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:6px 0;color:var(--text-dim)}
  .tweaks input[type=range]{width:100px}

  /* decorative grid bg */
  .stage::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:40px 40px;background-position:-1px -1px;
    opacity:.15;pointer-events:none;
    mask-image:radial-gradient(ellipse at center,black 50%,transparent 100%);
  }
  .board{position:relative;z-index:1}

  /* compact metrics strip — sits at top of stage */
  .foot{max-width:1450px;margin:0 auto 8px auto;display:flex;gap:10px;flex-wrap:nowrap}
  .foot .card{flex:1 1 0;min-width:0;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;align-items:baseline;gap:10px}
  .foot .card .k{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--text-mute);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .foot .card .v{font-size:15px;font-weight:600;white-space:nowrap}
  .foot .card .v .u{font-size:10px;color:var(--text-dim);margin-left:2px;font-weight:400}
  .foot .card .d{font-size:10px;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}

  /* legend row — sits tight under the diagram */
  .legend{max-width:1450px;margin:-6px auto 0 auto;display:flex;gap:22px;align-items:center;padding:2px 10px;font-size:11px;color:var(--text-mute);font-family:"JetBrains Mono",monospace}
  .legend .li{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{display:inline-block;width:18px;height:2px;border-radius:1px}
  .legend .sw.data{background:#3B47A6}
  .legend .sw.ctrl{background:#6B7DD0}
  .legend .sw.dash{width:14px;height:14px;border-radius:3px;background:#f5f8fc;border:1px dashed #b8c0d0}
  .legend .dot{position:relative;width:10px;height:10px;display:inline-block}
  .legend .dot::before,.legend .dot>span{content:"";position:absolute;inset:0;margin:auto;border-radius:50%}
  .legend .dot::before{width:10px;height:10px;background:#4A55B8;opacity:.25}
  .legend .dot>span{width:5px;height:5px;background:#4A55B8}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="mark"></div>
      <h1>AEGIS</h1>
      <span class="sub">Heterogeneous SoC · Interactive Trace</span>
    </div>
    <div class="spacer"></div>
    <div class="scenariobar" id="scenariobar"></div>
  </header>

  <div class="main">
    <section class="stage">
      <div class="foot" id="foot"></div>
      <div class="transport">
        <button class="btn" id="btn-prev" title="Prev step">‹</button>
        <button class="btn primary" id="btn-play" title="Play/Pause">▶</button>
        <button class="btn" id="btn-next" title="Next step">›</button>
        <button class="btn" id="btn-reset" title="Reset">↺</button>
        <div class="scrub" id="scrub"><div class="fill" id="scrub-fill"></div><div class="markers" id="scrub-markers"></div></div>
        <div class="step mono" id="stepreadout">phase 0 / 0 · t=0</div>
        <div class="speed"><span>speed</span>
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <button class="btn" id="btn-tweaks" title="Tweaks">⚙</button>
      </div>
      <div class="phasebar" id="phasebar"></div>
      <div class="board" id="board"></div>
      <div class="legend">
        <span class="li"><span class="sw data"></span>data</span>
        <span class="li"><span class="sw ctrl"></span>ctrl</span>
        <span class="li"><span class="dot"><span></span></span>active this phase</span>
        <span class="li"><span class="sw dash"></span>sub-datapath (tensor core)</span>
      </div>
    </section>
  </div>
</div>

<div class="tweaks" id="tweaks">
  <h5>Tweaks</h5>
  <label>Show wires <input type="checkbox" id="tw-wires" checked></label>
  <label>Show clock packet <input type="checkbox" id="tw-token" checked></label>
  <label>Animation speed <input type="range" id="tw-speed" min="0.25" max="4" step="0.25" value="1"></label>
  <label>Accent
    <select id="tw-accent" style="background:var(--bg-3);color:var(--text);border:1px solid var(--line-2);border-radius:4px;padding:2px 4px">
      <option value="mint" selected>Mint</option>
      <option value="blue">Blue</option>
      <option value="amber">Amber</option>
    </select>
  </label>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
/* ───── data.jsx ───── */
/* AEGIS demo — static data grounded in the real RTL/testbench */

// Block registry — matches the system architecture diagram & RTL files
const BLOCKS = {
  arm: {
    id: "arm", title: "Arm CPU", sub: "4-Thread FGMT · ARMv4T",
    rtl: "rtl/cpu/core/cpu_mt.v",
    specs: [
      ["Pipeline", "7-stage (IF1/IF2/ID/EX1/EX2/MEM/WB)"],
      ["Threads", "4 (fine-grained multithreading)"],
      ["ISA", "ARMv4T subset + MCR/MRC p10 (CP10)"],
      ["IMEM", "32-bit × 4096"],
      ["DMEM", "32-bit × 4096 (dual-port)"],
      ["Regfile", "BRAM 4R1W, 64×32 ({tid,reg})"],
      ["MAC unit", "32×32→64 (MUL / MLA / MLAL)"],
      ["Halt detect", "B . (0xEAFFFFFE) sticky / thread"]
    ],
    note: "Per-thread ARM cores on one pipeline. Each thread owns 16 GPRs; the regfile is a shared BRAM indexed by {tid,reg}. Writes from MLAL (two dest regs) are serialized over 2 cycles via dual_wr_stall."
  },
  pkt: {
    id: "pkt", title: "Packet Processor", sub: "Sole FIFO master",
    rtl: "rtl/network/pkt_proc.v",
    specs: [
      ["Role", "Decode cmd+data · init CPU IMEM/DMEM · repack"],
      ["Opcodes", "LOAD_IMEM / LOAD_DMEM / CPU_START / READBACK / SEND_PKT"],
      ["FSM states", "23 (IDLE → FETCH → DECODE → …)"],
      ["Word format", "{cmd[3:0], addr[11:0], count[15:0], param[31:0]}"],
      ["Auto-detect", "v2.1 — distinguishes cmd stream from network pkt"],
      ["Ethertype", "0x88B5 (custom SoC framing)"],
      ["→ ARM ctrl", "cpu_rst_n · cpu_start · entry_pc (pulses release)"],
      ["← ARM ctrl", "cpu_done (per-thread halt OR)"]
    ],
    note: "The only bus master allowed to touch the Conv-FIFO (Port B / SRAM mode) and CPU IMEM/DMEM (Port B). Decodes command words, unpacks 64-bit → 2×32-bit into CPU IMEM/DMEM, asserts cpu_rst_n + cpu_start with entry_pc to release the ARM cores, then packs CPU results back out on READBACK/SEND_PKT."
  },
  fifo: {
    id: "fifo", title: "Conv. FIFO", sub: "64-bit · 4096 depth",
    rtl: "rtl/network/conv_fifo.v",
    specs: [
      ["Width", "64-bit data + 8-bit ctrl"],
      ["Depth", "4096 entries"],
      ["Modes", "RX_FIFO / SRAM / TX_DRAIN (2-bit)"],
      ["Port A", "NetFPGA RX ingress · TX_DRAIN egress"],
      ["Port B", "pkt_proc (SRAM-mode R/W + ptr wr)"],
      ["Nearly-full", "threshold = 4"],
      ["Pointers", "head / tail / pkt_end (12-bit)"]
    ],
    note: "3-mode convertible FIFO. RX_FIFO accumulates inbound NetFPGA words on Port A; SRAM exposes the buffer as dual-port RAM for pkt_proc on Port B; TX_DRAIN streams packed replies back out of Port A (tx_start from pkt_proc kicks drain)."
  },
  cpudmem: {
    id: "cpudmem", title: "CPU DMEM", sub: "32-bit · 4096 · dual-port",
    rtl: "rtl/cpu/testmem/test_d_mem.v",
    specs: [
      ["Width × Depth", "32 × 4096"],
      ["Port A", "CPU LD/ST (byte-addr → word-addr)"],
      ["Port B", "pkt_proc ⇄ DMA (word-addr, muxed)"],

<script type="text/babel">
/* ───── diagram.jsx ───── */
/* Diagram — the SVG architecture board with click-to-inspect + animated wires */
const { useMemo } = React;

// anchor positions inside a block rect (normalized to block w/h)
function anchor(block, which){
  const { x, y, w, h } = block;
  const cx = x + w/2, cy = y + h/2;
  switch(which){
    case "n":  return { x: cx, y: y };
    case "s":  return { x: cx, y: y + h };
    case "e":  return { x: x + w, y: cy };
    case "w":  return { x: x, y: cy };
    case "nw": return { x: x + w*0.25, y: y };
    case "ne": return { x: x + w*0.75, y: y };
    case "sw": return { x: x + w*0.25, y: y + h };
    case "se": return { x: x + w*0.75, y: y + h };
    case "ee": return { x: x + w, y: y + h*0.75 };
    case "en": return { x: x + w, y: y + h*0.25 };
    case "ww": return { x: x, y: y + h*0.75 };
    case "wn": return { x: x, y: y + h*0.25 };
    case "ws": return { x: x, y: y + h*0.88 };
    case "es": return { x: x + w, y: y + h*0.88 };
    default:   return { x: cx, y: cy };
  }
}

// build an orthogonal L/Z path from p1 to p2, with optional detour via a given X corridor
function orthoPath(a, b, fa, ta, via){
  const HORIZ = new Set(["e","w","ee","en","ww","wn","ws","es"]);
  const fh = HORIZ.has(fa);
  const th = HORIZ.has(ta);
  if (via != null){
    return `M${a.x},${a.y} H${via} V${b.y} H${b.x}`;
  }
  const midX = (a.x + b.x) / 2;
  const midY = (a.y + b.y) / 2;
  if (fh && th){
    return `M${a.x},${a.y} H${midX} V${b.y} H${b.x}`;
  } else if (!fh && !th){
    return `M${a.x},${a.y} V${midY} H${b.x} V${b.y}`;
  } else if (fh && !th){
    return `M${a.x},${a.y} H${b.x} V${b.y}`;
  } else {
    return `M${a.x},${a.y} V${b.y} H${b.x}`;
  }
}

function Diagram({ selected, activeBlocks, activeWires, tokens, onSelect, showWires, showToken, phaseLabel }){
  const { BLOCKS, LAYOUT, WIRES, TC } = window.AEGIS;
  const W = 1330, H = 515;

  const wirePaths = useMemo(() => {

        <rect x="480" y="200" width="140" height="225" rx="6" fill="#eef2f8" opacity=".55"/>

      {showWires && wirePaths.map(w => {

        let lx, ly, anchor = "middle";

            )}
            {act && (
              <circle cx={rect.x + rect.w - 12} cy={rect.y + 12} r="4" fill="#4A55B8">
                <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
              </circle>

          </g>
        );
      })}

      {(() => {

        const fuW = 118, fuH = 34, fuGap = 14, badgeW = 34, badgeGap = 14;
        const laneInnerW = 2*fuW + fuGap + badgeGap + badgeW;
        const laneW = laneInnerW + 24;
        const laneX = (gpu.w - laneW) / 2;
        const laneY = bandY + 50;
        const laneH = fuH + 22;
        const fuY = laneY + (laneH - fuH) / 2;
        const fuAx = laneX + 12;
        const fuBx = fuAx + fuW + fuGap;
        const badgeX = fuBx + fuW + badgeGap;

        const tcY = 184, tcH = 282;
        const cellA  = 20, cellF  = 26;
        const tileSide = 4*cellA;
        const fmaSide  = 4*cellF;
        const tileGap  = 24;
        const centerX = gpu.w / 2;
        const abPairW = 2*tileSide + tileGap;
        const tileAbY = tcY + 48;
        const tileAx  = centerX - abPairW/2;
        const tileBx  = tileAx + tileSide + tileGap;
        const fmaX = centerX - fmaSide/2;
        const fmaY = tileAbY + tileSide + 8;
        const tileCx = fmaX - tileSide - tileGap;
        const tileCy = fmaY + (fmaSide - tileSide)/2;
        const coutW = fmaSide, coutH = 30;
        const coutX = fmaX;
        const coutY = fmaY + fmaSide + 8;

        const cellFill  = tcActive ? "#dde7f7" : "#e7eef8";
        const cellStk   = "#6975a8";
        const mulFill   = tcActive ? "#c5cdec" : "#e6ebf4";
        const mulStk    = tcActive ? "#4A55B8" : "#8e95a8";
        const outFill   = tcActive ? "#7287d4" : "#e6ebf4";
        const outStk    = tcActive ? "#2E3A8C" : "#7a82a0";
        const mk = tcActive ? "url(#arrow-tc-a)" : "url(#arrow-tc)";
        const wire = tcActive ? "#4A55B8" : "#8e95a8";

        return (
          <g className={`tc-inset ${tcActive?"active":""}`} transform={`translate(${gpu.x}, ${gpu.y})`}>
            <rect x="10" y={bandY} width={gpu.w-20} height={bandH} rx="8"
                  fill="#f5f8fc" stroke="#b8c0d0" strokeDasharray="3 3"/>
            <text x={gpu.w/2} y={bandY+20} textAnchor="middle" className="tc-title">
              SP  LANE  ·  scalar  compute

            {[3,2,1].map(k => (
              <rect key={`laneshadow-${k}`}
                    x={laneX + k*4} y={laneY + k*4}

            ))}
            <rect x={laneX} y={laneY} width={laneW} height={laneH} rx="8"

                  fill={tcActive?"#d6deec":"#e3e8f1"}

            <text x={fuAx + fuW/2} y={fuY + fuH/2 + 4} textAnchor="middle" className="tc-stage" style={{fontSize:12}}>INT16 ALU</text>

<script type="text/babel">

                <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"3px 0"}}>
                  <span style={{color:"var(--text-mute)"}}>{k}</span>
                  <span style={{color:"var(--accent)"}}>{v}</span>
                </div>
              ))}
              <div style={{marginTop:6,color:"var(--text-mute)",fontSize:11}}>reference: ann_hw_compat_info.txt</div>
            </div>
          </>
        )}
        <div style={{marginTop:18,padding:"10px 0",borderTop:"1px dashed var(--line)",fontSize:12,color:"var(--text-mute)"}}>
          Click any block in the diagram to inspect its internals.
        </div>
      </div>
    );
  }
  const b = BLOCKS[blockId];
  const phaseState = phase?.state?.[blockId];
  const isActive = phase?.active?.includes(blockId);
  return (
    <div className="inspect">
      <h3>Block {isActive && <span className="pill live">active</span>}</h3>
      <h2>{b.title}</h2>
      <div className="row"><span className="k">subtitle</span><span className="v">{b.sub}</span></div>
      <div className="row"><span className="k">RTL file</span><span className="v">{b.rtl}</span></div>
      <h3 style={{marginTop:16}}>Specs</h3>
      {b.specs.map(([k,v]) => (
        <div className="row" key={k}><span className="k">{k}</span><span className="v">{v}</span></div>
      ))}
      {phaseState && (
        <>
          <h3 style={{marginTop:16}}>Live state · phase {phase.t}</h3>
          {phaseState.map(([k,v]) => (
            <div className="row" key={k}>
              <span className="k">{k}</span>
              <span className="v" style={{color:"var(--accent)"}}>{v}</span>
            </div>
          ))}
        </>
      )}
      <div className="note">{b.note}</div>
    </div>
  );
}

function LogPanel({ scenario, upto }){
  const entries = [];
  for (let i = 0; i < scenario.phases.length && i <= upto; i++){
    const p = scenario.phases[i];
    entries.push({
      cyc: `${String(p.cycle).padStart(5," ")}`,
      ev: p.log,
      active: p.active
    });
  }
  return (
    <div className="log">
      {entries.map((e,i) => (
        <div className="line" key={i}>
          <span className="cyc">{e.cyc}</span>
          <span className="ev">
            <span className="block">[{e.active?.[0] || "soc"}]</span> {e.ev}
          </span>
        </div>
      ))}
      {entries.length === 0 && <div style={{color:"var(--text-mute)"}}>No events yet — press play.</div>}
    </div>
  );
}

function VerifyPanel(){
  const { VERIFY } = window.AEGIS;
  return (
    <div className="verify">
      <h4>Coverage summary</h4>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <SumCard k="modules verified" v={VERIFY.summary.modules}/>
        <SumCard k="testbenches" v={VERIFY.summary.testbenches}/>
        <SumCard k="blocks → RTL mapped" v={`${VERIFY.summary.blocks_mapped}/12`}/>
        <SumCard k="open findings" v={VERIFY.summary.anomalies}/>
      </div>

      <h4>Diagram ↔ RTL mapping</h4>
      {VERIFY.mapping.map((m,i) => (
        <div className="row2" key={i}>
          <div className="l">
            {m.block}
            <small>{m.file} · {m.spec}</small>
            <small style={{color:"var(--text-dim)"}}>{m.note}</small>
          </div>
          <span className={`badge ${m.status}`}>{m.status}</span>
        </div>
      ))}

      <h4>Findings · design docs + RTL review</h4>
      {VERIFY.findings.map((f,i) => (
        <div className="row2" key={i}>
          <div className="l">
            {f.title}
            <small>{f.file}</small>
            <small style={{color:"var(--text-dim)"}}>{f.detail}</small>
          </div>
          <span className={`badge ${f.sev==="warn"?"warn":f.sev==="ok"?"ok":"info"}`}>{f.sev}</span>
        </div>
      ))}

      <h4>Cross-referenced docs</h4>
      <div style={{fontSize:12,color:"var(--text-dim)",lineHeight:1.6}}>
        • System Architecture.pdf (doc/)<br/>
        • isa_v2_1_wmma_4r4w.pdf — GPU opcode reference<br/>
        • EE533 Lab 9 Report.pdf — CP10/DMA/GPU integration<br/>
        • Floating-Point Operator v3.0.pdf — BF16 datapath<br/>
        • model/ann_hw_compat_info.txt — golden logits
      </div>
    </div>
  );
}

function SumCard({ k, v }){
  return (
    <div style={{background:"var(--bg-3)",border:"1px solid var(--line)",borderRadius:6,padding:"10px 12px"}}>
      <div style={{fontSize:10,letterSpacing:".1em",textTransform:"uppercase",color:"var(--text-mute)",fontFamily:'"JetBrains Mono",monospace'}}>{k}</div>
      <div style={{fontSize:22,fontWeight:600,marginTop:2}}>{v}</div>
    </div>
  );
}

window.Panels = { InspectPanel, LogPanel, VerifyPanel };
</script>

<script type="text/babel">
/* ───── app.jsx ───── */
/* Main app — orchestrates scenarios, phase playback, selection state */
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "wires": true,
  "token": true,
  "speed": 1,
  "accent": "mint"
}/*EDITMODE-END*/;

const PHASE_MS_BASE = 1600;

function App(){
  const { SCENARIOS } = window.AEGIS;
  const scenarioIds = Object.keys(SCENARIOS);

  const [scenarioId, setScenarioId] = useState(() => "hetero");
  const [phaseIdx, setPhaseIdx] = useState(() => parseInt(localStorage.getItem("aegis.phase") || "0", 10));
  const [playing, setPlaying] = useState(false);
  const [selected, setSelected] = useState(null);
  const [speed, setSpeed] = useState(1);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tw, setTw] = useState(TWEAK_DEFAULTS);

  const scenario = SCENARIOS[scenarioId];
  const total = scenario.phases.length;
  const phase = scenario.phases[Math.min(phaseIdx, total-1)];

  useEffect(() => { localStorage.setItem("aegis.scenario", scenarioId); }, [scenarioId]);
  useEffect(() => { localStorage.setItem("aegis.phase", String(phaseIdx)); }, [phaseIdx]);

  const timerRef = useRef(null);
  useEffect(() => {
    clearInterval(timerRef.current);
    if (!playing) return;
    const tick = () => {
      setPhaseIdx(i => {
        if (i >= total - 1){ setPlaying(false); return i; }
        return i + 1;
      });
    };
    timerRef.current = setInterval(tick, PHASE_MS_BASE / speed / tw.speed);
    return () => clearInterval(timerRef.current);
  }, [playing, speed, total, tw.speed]);

  useEffect(() => {
    const h = (e) => {
      if (e.key === " "){ e.preventDefault(); setPlaying(p => !p); }
      else if (e.key === "ArrowRight"){ setPhaseIdx(i => Math.min(i+1, total-1)); }
      else if (e.key === "ArrowLeft"){ setPhaseIdx(i => Math.max(i-1, 0)); }
      else if (e.key === "Escape"){ setSelected(null); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [total]);

  useEffect(() => { if (phaseIdx >= total) setPhaseIdx(0); }, [scenarioId]);

  useEffect(() => {
    const h = (ev) => {
      if (ev.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      else if (ev.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", h);
    window.parent.postMessage({type:"__edit_mode_available"}, "*");
    return () => window.removeEventListener("message", h);
  }, []);
  const setTweak = (k, v) => {
    setTw(prev => {
      const next = {...prev, [k]: v};
      window.parent.postMessage({type:"__edit_mode_set_keys", edits:{[k]:v}}, "*");
      return next;
    });
  };

  const active = phase?.active || [];
  const wires = phase?.wires || [];
  const tokens = phase?.tokens || [];

  useEffect(() => {
    const el = document.getElementById("scenariobar");
    el.innerHTML = "";
    scenarioIds.forEach(id => {
      const b = document.createElement("button");
      b.textContent = SCENARIOS[id].title;
      b.className = id === scenarioId ? "active" : "";
      b.onclick = () => { setScenarioId(id); setPhaseIdx(0); setPlaying(false); setSelected(null); };
      el.appendChild(b);
    });
  }, [scenarioId]);

  useEffect(() => {
    const el = document.getElementById("phasebar");
    el.innerHTML = "";
    // one-line phase strip: use short labels (fallback to first 2 words of full label)
    const shortLabel = (p) => p.short || p.label.split(/[ ·•\-]/).filter(Boolean).slice(0,2).join(" ");
    scenario.phases.forEach((p, i) => {
      const d = document.createElement("div");
      d.className = "p " + (i === phaseIdx ? "active" : (i < phaseIdx ? "done":""));
      d.title = p.label;
      d.innerHTML = `<span class="n">φ${String(i+1).padStart(2,"0")}</span><span class="lbl">${shortLabel(p)}</span>`;
      d.onclick = () => setPhaseIdx(i);
      d.style.cursor = "pointer";
      el.appendChild(d);
    });
  }, [scenarioId, phaseIdx]);

  useEffect(() => {
    const el = document.getElementById("foot");
    const fmt = n => (n ?? 0).toLocaleString("en-US");
    const lastCyc = scenario.phases[scenario.phases.length - 1]?.cycle ?? 0;
    const curCyc  = phase?.cycle ?? 0;
    const latency = `~${(lastCyc * 8 / 1000).toFixed(1)}`;
    const progressPct = lastCyc ? ((curCyc / lastCyc) * 100).toFixed(1) : "0.0";
    const cards = [
      { k:"CYCLE",   v: fmt(curCyc),                     d: `${progressPct}% of ${fmt(lastCyc)} @ 125 MHz · ${(curCyc*8/1000).toFixed(2)} µs elapsed` },
      { k:"PHASE",   v: `${phaseIdx+1}/${total}`,        d: phase?.label || "" },
      { k:"LATENCY", v: latency, u:"µs",                 d: `end-to-end · HW scheduler ${fmt(lastCyc)} cyc · 36 tiles (L1 24 + L2 11 + L3 1)` },
      { k:"RATE",    v: "8", u:"Gbps",                   d: "NetFPGA · 64b @ 125 MHz · ~1,590 inf/s" }
    ];
    el.innerHTML = cards.map(c => `
      <div class="card">
        <div class="k">${c.k}</div>
        <div class="v">${c.v}${c.u?`<span class="u">${c.u}</span>`:""}</div>
        <div class="d">${c.d}</div>
      </div>`).join("");
  }, [phaseIdx, scenarioId]);

  useEffect(() => {
    document.getElementById("scrub-fill").style.width = `${((phaseIdx+1)/total)*100}%`;
    document.getElementById("stepreadout").textContent = `phase ${phaseIdx+1}/${total} · cyc ${phase?.cycle ?? 0}`;
    document.getElementById("btn-play").textContent = playing ? "❚❚" : "▶";
    const mk = document.getElementById("scrub-markers");
    mk.innerHTML = "";
    for (let i=0;i<total;i++){
      const m = document.createElement("div"); m.className="m";
      m.style.left = `${(i/(total-1))*100}%`;
      mk.appendChild(m);
    }
  }, [phaseIdx, total, playing]);

  useEffect(() => {
    document.getElementById("btn-play").onclick = () => setPlaying(p => !p);
    document.getElementById("btn-prev").onclick = () => setPhaseIdx(i => Math.max(0, i-1));
    document.getElementById("btn-next").onclick = () => setPhaseIdx(i => Math.min(total-1, i+1));
    document.getElementById("btn-reset").onclick = () => { setPhaseIdx(0); setPlaying(false); setSelected(null); };
    document.getElementById("scrub").onclick = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - r.left)/r.width;
      setPhaseIdx(Math.max(0, Math.min(total-1, Math.round(pct*(total-1)))));
    };
    document.getElementById("speed").onchange = (e) => setSpeed(parseFloat(e.target.value));
    document.getElementById("btn-tweaks").onclick = () => setTweaksOpen(o => !o);
    const twEl = document.getElementById("tweaks");
    twEl.classList.toggle("open", tweaksOpen);
    document.getElementById("tw-wires").checked = tw.wires;
    document.getElementById("tw-wires").onchange = (e) => setTweak("wires", e.target.checked);
    document.getElementById("tw-token").checked = tw.token;
    document.getElementById("tw-token").onchange = (e) => setTweak("token", e.target.checked);
    document.getElementById("tw-speed").value = tw.speed;
    document.getElementById("tw-speed").onchange = (e) => setTweak("speed", parseFloat(e.target.value));
    document.getElementById("tw-accent").value = tw.accent;
    document.getElementById("tw-accent").onchange = (e) => {
      setTweak("accent", e.target.value);
      const map = { mint:"#4A55B8", blue:"#3B47A6", amber:"#88AED4" };
      document.documentElement.style.setProperty("--accent", map[e.target.value]);
    };
  }, [total, tweaksOpen, tw]);

  const Diagram = window.Diagram;

  return (
    <>
      {ReactDOM.createPortal(
        <Diagram selected={selected} activeBlocks={active} activeWires={wires}
                 tokens={tokens} onSelect={setSelected}
                 showWires={tw.wires} showToken={tw.token}
                 phaseLabel={phase?.label || ""}/>,
        document.getElementById("board")
      )}
    </>
  );
}

const __host = document.createElement("div");
__host.style.display = "none";
document.body.appendChild(__host);
ReactDOM.createRoot(__host).render(<App/>);
</script>
</body>
</html>
